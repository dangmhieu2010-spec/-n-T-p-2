                section: "PHẦN II. CÂU HỎI TRẮC NGHIỆM ĐÚNG/SAI",
                question: "Câu 2. Phần mềm thương mại là phần mềm được phát triển để kinh doanh, thường được phân phối dưới dạng mã máy.",
                statements: [
                    { id: "a", text: "a) Phần mềm thương mại luôn luôn là phần mềm trả phí.", correct: false, explanation: "Sai. Đôi khi có các bản dùng thử miễn phí." },
                    { id: "b", text: "b) Phần mềm thương mại không thể được sửa đổi bởi người dùng.", correct: true, explanation: "Đúng. Mã nguồn đã bị đóng." },
                    { id: "c", text: "c) Phần mềm thương mại thường được hỗ trợ kỹ thuật bởi nhà sản xuất.", correct: true, explanation: "Đúng." },
                    { id: "d", text: "d) Phần mềm thương mại không thể được sử dụng miễn phí.", correct: false, explanation: "Sai." }
                ]
            },
            {
                id: 27,
                type: "tf",
                section: "PHẦN II. CÂU HỎI TRẮC NGHIỆM ĐÚNG/SAI",
                question: "Câu 3. Máy tính có thể kết nối với các thiết bị ngoại vi thông qua cổng kết nối hoặc mạng không dây.",
                statements: [
                    { id: "a", text: "a) Cổng USB là loại cổng kết nối phổ biến nhất hiện nay.", correct: true, explanation: "Đúng." },
                    { id: "b", text: "b) Cổng HDMI chỉ có thể truyền tải hình ảnh.", correct: false, explanation: "Sai. HDMI truyền cả âm thanh và hình ảnh." },
                    { id: "c", text: "c) Bluetooth là một loại mạng không dây tốc độ cao.", correct: false, explanation: "Sai. Bluetooth là mạng không dây tầm ngắn." },
                    { id: "d", text: "d) Wifi là một loại mạng không dây tầm ngắn/trung bình phổ biến.", correct: true, explanation: "Đúng." }
                ]
            },
            {
                id: 28,
                type: "tf",
                section: "PHẦN II. CÂU HỎI TRẮC NGHIỆM ĐÚNG/SAI",
                question: "Câu 4. Thư điện tử là dịch vụ trực tuyến cho phép người dùng gửi và nhận thư điện tử.",
                statements: [
                    { id: "a", text: "a) Thư điện tử không thể được sử dụng để gửi tệp đính kèm.", correct: false, explanation: "Sai. Email cho phép đính kèm tệp." },
                    { id: "b", text: "b) Thư điện tử có thể được sử dụng để giao tiếp với nhiều người cùng một lúc.", correct: true, explanation: "Đúng." },
                    { id: "c", text: "c) Thư điện tử không có bất kỳ nguy cơ nào.", correct: false, explanation: "Sai. Email tiềm ẩn rủi ro lừa đảo, rác, mã độc." },
                    { id: "d", text: "d) Thư điện tử là một phương thức giao tiếp nhanh chóng và tiện lợi.", correct: true, explanation: "Đúng." }
                ]
            }
        ];

        function App() {
            const [userAnswers, setUserAnswers] = useState({});
            const [submitted, setSubmitted] = useState(false);

            const handleMC = (qId, optionIdx) => {
                if (submitted) return;
                setUserAnswers(prev => ({ ...prev, [qId]: optionIdx }));
            };

            const handleTF = (qId, stmtId, val) => {
                if (submitted) return;
                setUserAnswers(prev => ({
                    ...prev,
                    [qId]: { ...prev[qId], [stmtId]: val }
                }));
            };

            const calculateResults = () => {
                let correctCount = 0;
                let totalItems = 0;

                de2Data.forEach(q => {
                    if (q.type === 'mc') {
                        totalItems += 1;
                        if (userAnswers[q.id] === q.correctAnswer) correctCount += 1;
                    } else if (q.type === 'tf') {
                        q.statements.forEach(st => {
                            totalItems += 1;
                            if (userAnswers[q.id]?.[st.id] === st.correct) correctCount += 1;
                        });
                    }
                });

                const score = Math.round((correctCount / totalItems) * 10 * 10) / 10;
                return { score, correctCount, totalItems };
            };

            const results = submitted ? calculateResults() : null;

            return (
                <div class="max-w-3xl mx-auto bg-white shadow-xl rounded-2xl p-4 md:p-8 border border-slate-200">
                    <header class="border-b pb-4 mb-6 text-center">
                        <span class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full uppercase">Đề Số 2 - Tin học 11 KNTT</span>
                        <h1 class="text-xl md:text-2xl font-bold text-slate-800 mt-2">Bài Ôn Tập Trắc Nghiệm Trực Tác (Đề 2)</h1>
                        <p class="text-slate-500 text-xs mt-1">Gồm trọn vẹn 24 câu hỏi ABCD + 4 câu Đúng/Sai (16 ý)</p>
                    </header>

                    {submitted && (
                        <div class="mb-6 p-5 bg-blue-50 border border-blue-200 rounded-xl text-center">
                            <h2 class="text-lg font-bold text-blue-900 mb-1">Kết Quả Đề 2</h2>
                            <div class="text-3xl font-black text-blue-600 mb-1">{results.score} / 10 Điểm</div>
                            <p class="text-xs text-slate-600 mb-3">
                                Trả lời chính xác <span class="font-bold text-blue-700">{results.correctCount}/{results.totalItems}</span> câu/ý.
                            </p>
                            <button 
                                onClick={() => { setSubmitted(false); setUserAnswers({}); }}
                                class="px-5 py-2 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 transition text-sm"
                            >
                                Làm lại Đề 2
                            </button>
                        </div>
                    )}

                    <div class="space-y-6">
                        {de2Data.map((q, idx) => (
                            <div key={q.id} class="p-4 border border-slate-200 rounded-xl bg-slate-50/50">
                                <div class="text-xs font-semibold text-blue-600 uppercase mb-1">{q.section}</div>
                                <div class="font-semibold text-slate-800 text-sm md:text-base mb-3 whitespace-pre-line">
                                    {q.question}
                                </div>

                                {q.type === 'mc' ? (
                                    <div class="grid grid-cols-1 gap-2">
                                        {q.options.map((opt, optIdx) => {
                                            const isSelected = userAnswers[q.id] === optIdx;
                                            const isCorrect = optIdx === q.correctAnswer;
                                            let btnStyle = "bg-white border-slate-200 text-slate-700 hover:bg-slate-100";

                                            if (submitted) {
                                                if (isCorrect) btnStyle = "bg-green-100 border-green-500 text-green-900 font-semibold";
                                                else if (isSelected) btnStyle = "bg-red-100 border-red-500 text-red-900";
                                            } else if (isSelected) {
                                                btnStyle = "bg-blue-100 border-blue-500 text-blue-900 font-semibold";
                                            }

                                            return (
                                                <button
                                                    key={optIdx}
                                                    onClick={() => handleMC(q.id, optIdx)}
                                                    class={`text-left p-2.5 border rounded-lg transition text-xs md:text-sm ${btnStyle}`}
                                                >
                                                    {opt}
                                                </button>
                                            );
                                        })}
                                        {submitted && (
                                            <div class="mt-2 text-xs p-2 bg-slate-100 rounded text-slate-600">
                                                💡 <strong>Giải thích:</strong> {q.explanation}
                                            </div>
                                        )}
                                    </div>
                                ) : (
                                    <div class="space-y-2">
                                        {q.statements.map(st => {
                                            const userVal = userAnswers[q.id]?.[st.id];
                                            return (
                                                <div key={st.id} class="bg-white p-2.5 border border-slate-200 rounded-lg flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                                                    <span class="text-xs md:text-sm text-slate-700 flex-1">{st.text}</span>
                                                    <div class="flex items-center space-x-2">
                                                        {[true, false].map(val => {
                                                            const isBtnSelected = userVal === val;
                                                            const isRight = val === st.correct;
                                                            let stStyle = "bg-slate-100 text-slate-600 hover:bg-slate-200";

                                                            if (submitted) {
                                                                if (isRight) stStyle = "bg-green-500 text-white font-bold";
                                                                else if (isBtnSelected) stStyle = "bg-red-500 text-white";
                                                            } else if (isBtnSelected) {
                                                                stStyle = "bg-blue-600 text-white font-bold";
                                                            }

                                                            return (
                                                                <button
                                                                    key={String(val)}
                                                                    onClick={() => handleTF(q.id, st.id, val)}
                                                                    class={`px-3 py-1 text-xs rounded border border-transparent transition ${stStyle}`}
                                                                >
                                                                    {val ? "ĐÚNG" : "SAI"}
                                                                </button>
                                                            );
                                                        })}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>

                    {!submitted && (
                        <div class="mt-8 text-center">
                            <button
                                onClick={() => setSubmitted(true)}
                                class="px-8 py-3 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 transition shadow-md"
                            >
                                Nộp Bài Đề 2 & Xem Điểm
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
